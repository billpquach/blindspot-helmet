<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Blindspot 2.5D View</title>
<style>
  :root {
    --bg: #0b0e13; --panel: rgba(18, 23, 31, 0.78); --line: rgba(255, 255, 255, 0.08);
    --text: #e8ecf1; --muted: #8a94a3; --accent: #3ea6ff;
    --yellow: #f2c94c; --orange: #ff8a1f; --red: #ff3b30; --green: #3ddc97;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  header { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px;
    padding: 10px max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
    background: linear-gradient(var(--bg), rgba(11, 14, 19, 0)); z-index: 5; }
  .brand { font-weight: 700; letter-spacing: 0.14em; font-size: 13px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px;
    background: var(--panel); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .live .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  #stats { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 11px; font: inherit; font-size: 12px; cursor: pointer; }

  .edge { position: fixed; pointer-events: none; opacity: 0; transition: opacity 0.12s; z-index: 2; }
  .edge.left { left: 0; top: 0; bottom: 0; width: 24vw; background: linear-gradient(90deg, var(--c), transparent); }
  .edge.right { right: 0; top: 0; bottom: 0; width: 24vw; background: linear-gradient(270deg, var(--c), transparent); }
  .edge.bottom { left: 0; right: 0; bottom: 0; height: 30vh; background: linear-gradient(0deg, var(--c), transparent); }

  #banner { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); z-index: 6;
    display: flex; align-items: center; gap: 14px; padding: 12px 20px 12px 14px; border-radius: 18px;
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 2px solid var(--c, var(--orange)); max-width: calc(100vw - 24px); transition: opacity 0.15s; }
  #banner.hidden { opacity: 0; pointer-events: none; }
  #banner svg { width: 34px; height: 44px; flex: none; fill: var(--c, var(--orange)); }
  #banner.dim { border-color: transparent; }
  #banner.dim svg { fill: none; stroke: var(--c); stroke-width: 3; }
  #bTitle { font-size: 18px; font-weight: 700; }
  #bSub { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  #caption { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 6;
    padding: 8px 14px; border-radius: 12px; background: var(--panel); max-width: min(620px, calc(100vw - 24px));
    font-size: 15px; transition: opacity 0.3s; }
  #caption .src { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; margin-right: 8px; }
  #caption.hidden { opacity: 0; }

  #corner { position: fixed; left: 12px; top: 52px; z-index: 4; display: flex; flex-direction: column; gap: 6px;
    max-width: 30vw; }
  #scene { color: var(--muted); font-size: 12px; }
  #scene b { color: var(--accent); letter-spacing: 0.08em; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 11px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  #cam { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: 76px; z-index: 4;
    width: min(44vw, 560px); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .camera-tile { margin: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
    background: #0b0e13; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25); }
  .camera-tile figcaption { padding: 7px 10px; color: var(--text); background: var(--panel);
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .camera-image { position: relative; aspect-ratio: 4 / 3; }
  .camera-message { position: absolute; inset: 0; display: grid; place-items: center;
    padding: 8px; text-align: center; font-size: 12px; color: var(--muted); }
  #cam img { position: relative; display: block; width: 100%; height: 100%; object-fit: contain; background: #0b0e13; }
  #cam img[hidden] { display: none; }
  #cam.hidden { display: none; }

  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; z-index: 8; background: rgba(11, 14, 19, 0.72); text-align: center; }
  .overlay.hidden { display: none; }
  .overlay .big { font-size: 22px; font-weight: 700; }
  .overlay .sub { color: var(--muted); }
  #fault svg { width: 90px; height: 90px; stroke: var(--red); stroke-width: 10; stroke-linecap: round; }

  @media (max-width: 640px) {
    #banner { top: 50px; padding: 10px 14px 10px 10px; gap: 10px; width: calc(100vw - 24px); }
    #bTitle { font-size: 16px; }
    #cam { width: calc(100vw - 24px); bottom: max(64px, calc(env(safe-area-inset-bottom) + 48px)); }
    #corner { top: auto; bottom: calc((100vw - 34px) * 0.375 + 112px + env(safe-area-inset-bottom)); max-width: calc(100vw - 24px); }
    body.cameras-hidden #corner { bottom: 60px; }
    #caption { bottom: 12px; }
  }
  @media (max-height: 480px) and (orientation: landscape) {
    #cam { width: min(40vw, 360px); bottom: 52px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="edgeL" class="edge left"></div>
<div id="edgeR" class="edge right"></div>
<div id="edgeB" class="edge bottom"></div>

<header>
  <div class="brand">BLINDSPOT</div>
  <div id="status" class="pill"><span class="dot"></span><span id="statusText">connecting</span></div>
  <div id="stats"></div>
  <button id="camBtn" type="button" aria-controls="cam" aria-expanded="true">Hide cameras</button>
</header>

<div id="banner" class="hidden">
  <svg id="arrow" viewBox="0 0 44 64"></svg>
  <div><div id="bTitle"></div><div id="bSub"></div></div>
</div>

<div id="cam" aria-label="Camera previews">
  <figure class="camera-tile">
    <figcaption>Front camera</figcaption>
    <div class="camera-image"><span class="camera-message" id="frontMessage">Connecting&hellip;</span>
      <img id="frontCamImg" alt="Front camera preview"></div>
  </figure>
  <figure class="camera-tile">
    <figcaption>Rear camera</figcaption>
    <div class="camera-image"><span class="camera-message" id="rearMessage">Connecting&hellip;</span>
      <img id="rearCamImg" alt="Rear camera preview"></div>
  </figure>
</div>

<div id="corner">
  <div id="scene"></div>
  <div class="legend">
    <span><i style="background:#d4d9e0"></i>tracked</span>
    <span><i style="background:var(--yellow)"></i>approaching</span>
    <span><i style="background:var(--orange)"></i>blind spot</span>
    <span><i style="background:var(--red)"></i>danger</span>
  </div>
</div>
<div id="caption" class="hidden"></div>

<div id="fault" class="overlay hidden">
  <svg viewBox="0 0 100 100"><line x1="15" y1="15" x2="85" y2="85"/><line x1="85" y1="15" x2="15" y2="85"/></svg>
  <div class="big">Rear camera offline</div>
  <div class="sub">Alerts are paused. The rear light is back to a normal flash.</div>
</div>
<div id="wait" class="overlay">
  <div class="big">Waiting for the helmet&hellip;</div>
  <div class="sub">Start it with <code>python -m helmet.main</code> (or <code>--sim</code>)</div>
</div>

<script type="module">
import * as THREE from '/static/three.module.min.js';

// ------------------------------------------------------------------ constants
// The view is a chase view: the camera sits behind and above the rider looking forward, so the
// rider heads up the screen (north), front-camera objects are ahead of the bike and rear traffic
// comes up from the bottom (south). World units are metres, z = metres behind the rider
// (negative = ahead), x = metres to the rider's right (W below).
const TIER_HEX = { 0: 0xd4d9e0, 1: 0xf2c94c, 2: 0xff8a1f, 3: 0xff3b30 };
const TIER_CSS = { 1: 'var(--yellow)', 2: 'var(--orange)', 3: 'var(--red)' };
const BLINK_HZ = 4;                      // same as the OLED's HIGH blink
const ROAD_HALF = 6.5;
const qs = new URLSearchParams(location.search);
const tok = qs.get('t');
const $ = (id) => document.getElementById(id);
const W = (lat) => lat;                  // rider's lateral offset (m, + = right) -> world x
let camOn = true;                        // camera tiles shown (they take screen space; see placeCamera)
let viewBehind = 12, viewAhead = 8;      // drawn range, from the snapshot's view_range_m

// ------------------------------------------------------------------ renderer / camera
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e13);
scene.fog = new THREE.Fog(0x0b0e13, 40, 70);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
let forwardView = false;

// Where the rider sits between the top and bottom of the road area when the front camera is on:
// 0.4 = 40% of the space above (ahead), 60% below (behind), matching 8 m ahead / 12 m behind.
// /view?rider=0.5 centres the rider (allowed 0.25 to 0.5: past that the camera drops so low that the
// far end of the road and the horizon show).
const RIDER_ROW = Math.min(0.5, Math.max(0.25, parseFloat(qs.get('rider')) || 0.4));

// Frame the road clear of the overlays (phones: camera tiles and legend at the bottom; laptops:
// banner and legend at the top, camera tiles at the right, so the road shifts left while they
// show). With the front camera on, the rider goes on the RIDER_ROW line and viewBehind on the
// bottom row, and the road ahead runs on past viewAhead into the fog. Pinning the ahead edge
// to the top instead lets perspective squeeze the front into a sliver and push the rider up.
// Rear only: `ahead` (3 m) on the top row and viewBehind on the bottom row.
function placeCamera() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  const portrait = w / h < 0.8;
  const ahead = forwardView ? viewAhead : 3;             // rear camera only: just a little road ahead
  const top = portrait ? 135 : 175;                      // screen row for the far edge ahead (below the banner)
  const bottom = portrait ? (camOn ? 0.585 * h : h - 150) : h - 12;   // ... and for the far edge behind
  const cx = !portrait && camOn ? 0.4 : 0.5;
  const pitch = THREE.MathUtils.degToRad(portrait ? 58 : 48);   // tilt below horizontal
  camera.fov = portrait ? 60 : 45;
  const fullW = w * 2 * Math.max(cx, 1 - cx);
  camera.aspect = fullW / h;
  const ta = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const below = (y) => pitch + Math.atan((y - h / 2) / (h / 2) * ta);   // ray angle below horizontal for row y
  const cot = (a) => 1 / Math.tan(a);
  let height = (ahead + viewBehind) / (cot(below(top)) - cot(below(bottom)));
  let z = height * cot(below(top)) - ahead;
  if (forwardView) {
    const row = top + RIDER_ROW * (bottom - top);
    const h2 = viewBehind / (cot(below(row)) - cot(below(bottom)));
    const z2 = h2 * cot(below(row));
    const aheadAtTop = below(top) > 0 ? h2 * cot(below(top)) - z2 : Infinity;
    if (aheadAtTop >= ahead) { height = h2; z = z2; }   // else keep the whole front range on screen
  }
  camera.position.set(0, height, z);
  camera.lookAt(0, 0, z - height * cot(pitch));
  camera.setViewOffset(fullW, h, fullW / 2 - cx * w, 0, w, h);
  camera.updateProjectionMatrix();
  const toAhead = camera.position.distanceTo(new THREE.Vector3(0, 0, -ahead));
  scene.fog.near = toAhead + 3; scene.fog.far = toAhead + 30;   // fade the road just past the range
}
window.addEventListener('resize', placeCamera);
placeCamera();

scene.add(new THREE.HemisphereLight(0xffffff, 0x1b2029, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(-5, 14, 10);                  // from behind the camera: lights what it sees
scene.add(sun);

// ------------------------------------------------------------------ small helpers
function canvasTexture(w, h, draw) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const radial = (inner, outer) => canvasTexture(128, 128, (g, w, h) => {
  const grd = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  grd.addColorStop(0, inner); grd.addColorStop(1, outer);
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
});
const SHADOW_TEX = radial('rgba(0,0,0,0.75)', 'rgba(0,0,0,0)');
const GLOW_TEX = radial('rgba(255,255,255,1)', 'rgba(255,255,255,0)');

function flat(w, d, mat, x = 0, z = 0, y = 0.005) {       // a rectangle lying on the road
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}
function groundText(text, x, z, size, color, opacity) {
  const tex = canvasTexture(512, 128, (g, w, h) => {
    g.fillStyle = color; g.font = '600 64px system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2);
  });
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity, depthWrite: false });
  const m = flat(size * 4, size, mat, x, z, 0.012);
  m.rotation.set(-Math.PI / 2, 0, 0);         // readable from the chase camera looking forward
  return m;
}
function cylinder(a, b, r, mat) {                         // a rod between two points
  const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b);
  const len = va.distanceTo(vb);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10), mat);
  m.position.copy(va).add(vb).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), vb.clone().sub(va).normalize());
  return m;
}

// ------------------------------------------------------------------ road
flat(80, 100, new THREE.MeshStandardMaterial({ color: 0x0f1319, roughness: 1 }), 0, 20, 0);
flat(ROAD_HALF * 2, 110, new THREE.MeshStandardMaterial({ color: 0x1a2029, roughness: 0.95 }), 0, 20, 0.002);
const edgeMat = new THREE.MeshBasicMaterial({ color: 0x3a4452 });
for (const x of [-ROAD_HALF, ROAD_HALF]) flat(0.08, 110, edgeMat, x, 20, 0.006);   // as long as the road: both fade in the fog
// Distance rings every 5 m behind and ahead; setRange() shows the ones inside the drawn range.
const ringMat = new THREE.MeshBasicMaterial({ color: 0x2a323d });
const rings = [];
for (const z of [-15, -10, -5, 5, 10, 15, 20, 25, 30]) {
  const line = flat(ROAD_HALF * 2, 0.05, ringMat, 0, z, 0.006);
  const tex = canvasTexture(256, 96, (g, w, h) => {       // upright label: readable at any distance
    g.fillStyle = '#7d8796'; g.font = '600 56px system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(`${Math.abs(z)} m`, w / 2, h / 2);
  });
  const lab = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.75, depthWrite: false }));
  lab.scale.set(0.6 * 2.67, 0.6, 1);
  lab.position.set(W(4.3), 0.35, z);                      // inside the road: visible on a phone too
  scene.add(lab);
  rings.push({ z, line, lab });
}

// Your lane (bike + margin) and the two blind-spot zones. They light up from the SAME
// state the OLED shows (snapshot "hud"), so the phone, the OLED and the buzz always agree.
let corridorHalf = 0.6;
const laneMat = new THREE.MeshBasicMaterial({ color: 0x3ea6ff, transparent: true, opacity: 0.07, depthWrite: false });
const lane = flat(corridorHalf * 2, 1, laneMat, 0, 0, 0.008);       // length set by setRange()
const laneEdgeMat = new THREE.MeshBasicMaterial({ color: 0x3ea6ff, transparent: true, opacity: 0.35 });
const laneEdges = [-1, 1].map((s) => flat(0.04, 1, laneEdgeMat, s * corridorHalf, 0, 0.009));

const ZONE_W = 3.2, ZONE_Z0 = -1.5, ZONE_Z1 = 6.0;
const zones = {};
for (const [name, s] of [['LEFT', -1], ['RIGHT', 1]]) {
  const x = W(s * (corridorHalf + ZONE_W / 2));
  const z = (ZONE_Z0 + ZONE_Z1) / 2;
  const fill = flat(ZONE_W, ZONE_Z1 - ZONE_Z0,
    new THREE.MeshBasicMaterial({ color: 0xff8a1f, transparent: true, opacity: 0, depthWrite: false }), x, z, 0.01);
  const outline = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(ZONE_W, ZONE_Z1 - ZONE_Z0)),
    new THREE.LineBasicMaterial({ color: 0x8a94a3, transparent: true, opacity: 0.18 }));
  outline.rotation.x = -Math.PI / 2; outline.position.set(x, 0.011, z);
  scene.add(outline);
  groundText('BLIND SPOT', x, 3.2, 0.42, '#8a94a3', 0.35);
  zones[name] = { fill, outline };
}
function setRange() {                     // your lane and the rings cover exactly the drawn range
  const ahead = forwardView ? viewAhead : 3;
  for (const m of [lane, ...laneEdges]) { m.scale.y = ahead + viewBehind; m.position.z = (viewBehind - ahead) / 2; }
  for (const r of rings) r.line.visible = r.lab.visible = r.z > 0 ? r.z <= viewBehind : forwardView && -r.z <= viewAhead;
}
setRange();
function setCorridor(half) {
  if (!half || Math.abs(half - corridorHalf) < 1e-3) return;
  corridorHalf = half;
  lane.scale.x = half / 0.6;
  laneEdges.forEach((m, i) => (m.position.x = (i ? 1 : -1) * half));
  for (const [name, s] of [['LEFT', -1], ['RIGHT', 1]]) {
    const x = W(s * (half + ZONE_W / 2));
    zones[name].fill.position.x = x; zones[name].outline.position.x = x;
  }
}

// ------------------------------------------------------------------ the rider
const bike = new THREE.Group();
const frameMat = new THREE.MeshStandardMaterial({ color: 0x9aa3ad, roughness: 0.5, metalness: 0.4 });
const riderMat = new THREE.MeshStandardMaterial({ color: 0xe6e9ee, roughness: 0.6 });
const helmetMat = new THREE.MeshStandardMaterial({ color: 0x3ea6ff, roughness: 0.35, emissive: 0x0f3a66, emissiveIntensity: 0.6 });
for (const z of [-0.52, 0.52]) {
  const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.33, 0.04, 10, 28), new THREE.MeshStandardMaterial({ color: 0x20252c }));
  wheel.rotation.y = Math.PI / 2; wheel.position.set(0, 0.34, z);
  bike.add(wheel);
}
bike.add(cylinder([0, 0.34, 0.52], [0, 0.62, 0.02], 0.025, frameMat));    // chain stay / seat tube
bike.add(cylinder([0, 0.62, 0.02], [0, 0.78, -0.42], 0.025, frameMat));   // top tube
bike.add(cylinder([0, 0.34, -0.52], [0, 0.95, -0.46], 0.025, frameMat));  // fork
bike.add(cylinder([-0.32, 0.95, -0.46], [0.32, 0.95, -0.46], 0.02, frameMat)); // handlebar
const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.42, 6, 12), riderMat);
torso.position.set(0, 1.18, -0.08); torso.rotation.x = -0.95;
bike.add(torso);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 20, 14), helmetMat);
head.scale.set(1, 0.85, 1.25); head.position.set(0, 1.46, -0.42);
bike.add(head);
for (const s of [-1, 1]) {
  bike.add(cylinder([s * 0.17, 1.33, -0.25], [s * 0.3, 0.97, -0.46], 0.045, riderMat)); // arms
  bike.add(cylinder([s * 0.1, 0.98, 0.12], [s * 0.1, 0.42, -0.05], 0.06, riderMat));    // legs
}
scene.add(bike);
const halo = flat(2.6, 2.6, new THREE.MeshBasicMaterial({ map: GLOW_TEX, color: 0x3ea6ff, transparent: true,
  opacity: 0.35, depthWrite: false, blending: THREE.AdditiveBlending }), 0, 0, 0.013);

// ------------------------------------------------------------------ cars
// One fixed-size, Tesla-style car for every track (people in --demo-person too).
function extrudeProfile(points, width, bevel) {
  const shape = new THREE.Shape();
  points.forEach(([z, y], i) => (i ? shape.lineTo(-z, y) : shape.moveTo(-z, y)));
  const depth = width - 2 * bevel;
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelSize: bevel,
    bevelThickness: bevel, bevelSegments: 3, curveSegments: 6 });
  g.translate(0, 0, -depth / 2);
  g.rotateY(Math.PI / 2);                // profile x -> world -z, extrusion -> world x
  return g;
}
const CAR_BODY = extrudeProfile([[-2.2, 0.3], [-2.2, 0.64], [-2.02, 0.8], [-0.85, 0.87], [1.95, 0.9],
  [2.2, 0.78], [2.2, 0.3]], 1.8, 0.08);
const CAR_CABIN = extrudeProfile([[-0.95, 0.85], [-0.22, 1.38], [1.08, 1.4], [1.78, 0.86]], 1.52, 0.06);
const CAR_ROOF = new THREE.BoxGeometry(1.36, 0.05, 1.12);
const WHEEL = new THREE.CylinderGeometry(0.33, 0.33, 0.24, 18).rotateZ(Math.PI / 2);
const TAIL = new THREE.BoxGeometry(0.42, 0.1, 0.04);
const glassMat = new THREE.MeshStandardMaterial({ color: 0x18202b, roughness: 0.2, metalness: 0.3 });
const tyreMat = new THREE.MeshStandardMaterial({ color: 0x0d1015, roughness: 0.9 });
const tailMat = new THREE.MeshStandardMaterial({ color: 0xfff4d6, emissive: 0xfff0c8, emissiveIntensity: 1.0 });
const rearLightMat = new THREE.MeshStandardMaterial({ color: 0xff3b30, emissive: 0xc0141a, emissiveIntensity: 0.9 });

function makeLabel() {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 80;
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  sprite.scale.set(2.3, 0.72, 1);
  sprite.renderOrder = 10;

const ARROW_LEFT = '<polygon points="2,32 24,6 24,20 42,20 42,44 24,44 24,58"/>';

  const who = { person: 'Person', unknown: 'Something', car: 'Car' }[kindOf(car)];

  else if (r.includes('close pass')) title = `Close pass on your ${side}`;

  else if (r.includes('behind')) title = `${who} closing fast behind`;

  if (car.sonar_only) bits.push('side sensor only');

  if (!car.alongside && car.z != null) bits.push(`${car.z.toFixed(0)} m back`);

function updateBanner(data) {

      const what = collision.detected_label || 'object';
      $('bTitle').textContent = collision.state === 'BRAKE' ? 'BRAKE  BRAKE'
        : collision.state === 'CAUTION' ? `${what[0].toUpperCase()}${what.slice(1)} ahead` : collision.reason;
      const bits = [];
      if (collision.ttc_s != null) bits.push(`${collision.ttc_s.toFixed(1)} s to contact`);
      if (collision.z != null) bits.push(`~${collision.z.toFixed(1)} m ahead`);
      if (collision.speed_mps != null) bits.push(`closing ~${collision.speed_mps.toFixed(1)} m/s`);

    } else {
      $('bTitle').textContent = collision.state === 'BRAKE' ? 'BRAKE  BRAKE' : collision.state === 'CAUTION' ? 'Obstacle ahead' : collision.reason;
      $('bSub').textContent = collision.valid
        ? `${collision.distance_m.toFixed(2)} m gap · estimated approach ${collision.speed_mps.toFixed(2)} m/s · brake boundary ${collision.warning_distance_m.toFixed(2)} m`
        : 'Forward estimate unavailable · stationary-chair demo';

    b.dataset.tier = collision.state === 'BRAKE' ? '3' : '2';

  const hudTier = Math.max(0, ...Object.values(data.hud));

// ------------------------------------------------------------------ state from the Pi
const cars = new Map();
let last = null, lastMsg = 0, fps = 0;
function onState(data) {
  last = data; lastMsg = performance.now();
  const range = data.view_range_m || {};

    forwardView = Boolean(data.collision);
    if (range.behind) { viewBehind = range.behind; viewAhead = range.ahead; }
    setRange(); placeCamera();
  }
  setCorridor(data.corridor_half_m);
  sonarMount = data.sonar_mount || {};
  for (const [k, arc] of Object.entries(sonarArcs)) if (!(data.sonar && k in data.sonar)) arc.mesh.visible = false;
  const seen = new Set();
  for (const raw of [...data.cars, ...(data.front_obstacles || [])]) {
    // Past the drawn range one camera's distance is too rough: hide quiet objects, and pin
    // alerting ones at the edge (their label shows time to contact, not a made-up distance).
    const front = raw.source === 'front';
    const inRange = front ? -raw.z <= viewAhead : raw.z <= viewBehind;
    if (!inRange && !(raw.tier >= 1)) continue;
    const d = inRange ? raw : { ...raw, z: front ? -viewAhead : viewBehind, pinned: true };
    seen.add(d.id);
    let c = cars.get(d.id);
    if (c && c.kind !== kindOf(d)) { disposeCar(c); c = null; }       // tracker changed its mind on the class
    if (!c) { c = makeActor(d); cars.set(d.id, c); }
    if (c.data && c.kind === 'person') {

  updateBanner(data);
  updateSonar(data.sonar);
  $('fault').classList.toggle('hidden', !data.fault);
  const cap = $('caption');
  if (data.caption && data.caption.age < 4.5) {
    const src = data.caption.src === 'gemini' ? 'GEMINI' : data.caption.src === 'system' ? 'SYSTEM' : 'HELMET';
    cap.innerHTML = `<span class="src">${src}</span>`;
    cap.appendChild(document.createTextNode(data.caption.text));
    cap.classList.remove('hidden');
  } else cap.classList.add('hidden');
  const lines = [];
  if (data.collision) lines.push(data.collision.mode === 'camera-only'
    ? "<b>FRONT</b> &middot; camera-only, no calibration &middot; chairs shown as trees &middot; look where you're going"
    : '<b>FRONT DEMO</b> &middot; detected chair shown as tree &middot; straight approach, look ahead');
  if (data.demo_person) lines.push('<b>DEMO MODE</b> &middot; people stand in for cars');
  if (data.scene) lines.push(`<b>SIMULATOR</b> &middot; ${data.scene.replace(/[<&]/g, '')}`);
  $('scene').innerHTML = lines.join('<br>');

  const son = Object.entries(data.sonar || {}).filter(([, v]) => v != null).map(([k, v]) => `${k} ${v.toFixed(2)} m`);
  $('stats').textContent = [`${data.fps} fps`, data.det_ms ? `det ${data.det_ms} ms` : null,
    `${data.cars.length} tracked`, /Arduino on/.test(data.serial) ? 'Arduino ✓' : 'no Arduino', ...son,
    data.shaky ? 'head moving' : null].filter(Boolean).join(' · ');

    for (const m of c.mats) m.opacity = c.fade;

    c.glowMat.opacity = c.fade * (tier >= 3 ? (blinkOn ? 0.95 : 0.35) : tier === 2 ? 0.6 : 0);
    const text = d.pinned ? (d.ttc != null ? `${d.ttc.toFixed(1)} s` : `${Math.round(d.source === 'front' ? viewAhead : viewBehind)}+ m`)
      : d.source === 'front' ? (tier >= 2 && d.ttc != null ? `${d.label} · ${d.ttc.toFixed(1)} s`
        : `${d.label} · ${d.approx ? '~' : ''}${Math.abs(d.z).toFixed(1)} m ahead`)
      : d.measured != null ? `${d.measured.toFixed(2)} m gap`     // side sensor: a real measurement
      : tier >= 1 && d.ttc != null && !d.alongside ? `${d.ttc.toFixed(1)} s`
      : d.alongside ? 'beside' : `${Math.round(d.z)} m`;
    setLabel(c.label, text, tier);
    c.label.material.opacity = c.fade;
    const showPath = d.path != null && (d.on_path || tier >= 2) && !d.alongside && c.pos.z > NOSE[c.kind] + 0.6;
    c.ribbon.visible = showPath;
    if (showPath) {
      setRibbon(c.ribbon, c.pos.x, c.pos.z - NOSE[c.kind], W(d.path), 0.6, 0.14);
      c.ribbon.material.color.setHex(TIER_HEX[Math.max(tier, 2)]);
      c.ribbon.material.opacity = 0.75 * c.fade;
    }
  }

  // zones + screen edges: the OLED's state, blinking like the OLED for HIGH
  const hud = (last && connected && !last.fault) ? last.hud : {};
  const zoneOpacity = (t) => (t >= 3 ? (blinkOn ? 0.42 : 0.14) : t === 2 ? 0.24 : 0);
  for (const name of ['LEFT', 'RIGHT']) {
    const t = hud[name] || 0;
    zones[name].fill.material.color.setHex(TIER_HEX[Math.max(t, 2)]);
    zones[name].fill.material.opacity = zoneOpacity(t);
    zones[name].outline.material.opacity = t ? 0.55 : 0.18;
  }
  const tc = hud.CENTER || 0;
  laneMat.color.setHex(tc ? TIER_HEX[tc] : 0x3ea6ff);
  laneMat.opacity = tc ? zoneOpacity(tc) * 0.8 + 0.05 : 0.07;
  for (const [el, zone] of [[$('edgeL'), 'LEFT'], [$('edgeR'), 'RIGHT'], [$('edgeB'), 'CENTER']]) {
    const t = hud[zone] || 0;
    el.style.setProperty('--c', t >= 3 ? 'rgba(255,59,48,0.55)' : 'rgba(255,138,31,0.45)');
    el.style.opacity = t >= 3 ? (blinkOn ? 1 : 0.35) : t === 2 ? 0.8 : 0;
  }
  const b = $('banner');
  const bannerBlink = last?.collision?.state === 'BRAKE' ? ((now / 1000) * 2) % 1 < 0.5 : blinkOn;
  b.classList.toggle('dim', b.dataset.tier === '3' && !bannerBlink);
  if (!connected) b.classList.add('hidden');
  halo.material.opacity = 0.28 + 0.07 * Math.sin(now / 600);

  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
